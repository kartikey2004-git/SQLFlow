name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: sql-learn-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d sql-learn-test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      postgres-sandbox:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: sandbox_admin_password
          POSTGRES_DB: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_URL: postgres://ci:ci_password@localhost:5432/sql-learn-test
      DATABASE_URL: postgres://ci:ci_password@localhost:5432/sql-learn-test
      TEST_DATABASE_URL: postgres://ci:ci_password@localhost:5432/sql-learn-test
      SANDBOX_ADMIN_DATABASE_URL: postgres://postgres:sandbox_admin_password@localhost:5433/postgres
      TEST_SANDBOX_ADMIN_DATABASE_URL: postgres://postgres:sandbox_admin_password@localhost:5433/postgres
      SANDBOX_ROLE_SECRET: ci-sandbox-role-secret-0123456789abcdef
      BETTER_AUTH_SECRET: ci-better-auth-secret-0123456789abcdef
      BETTER_AUTH_URL: http://localhost:5000
      CLEANUP_TOKEN: ci-cleanup-token
      CORS_ORIGIN: http://localhost:3000
      PORT: 5000

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        working-directory: packages/database
        env:
          DIRECT_URL: postgres://build:build@localhost:5432/build
        run: bun run db:generate

      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/turbo
          key: turbo-api-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-api-${{ runner.os }}-

      - name: Run migrations against the test database
        working-directory: apps/api
        run: bun run migrate:test up

      - name: Typecheck
        run: bunx turbo run typecheck --filter=@sql-learn/api

      - name: Lint
        run: bunx turbo run lint --filter=@sql-learn/api

      - name: Test (including the adversarial sandbox security suite)
        run: bunx turbo run test --filter=@sql-learn/api

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/turbo
          key: turbo-web-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-web-${{ runner.os }}-

      - name: Lint
        run: bunx turbo run lint --filter=@sql-learn/web

      - name: Typecheck
        run: bunx turbo run typecheck --filter=@sql-learn/web

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000
        run: bunx turbo run build --filter=@sql-learn/web

  docker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: sqlflow-api
            dockerfile: apps/api/Dockerfile
          - name: sqlflow-worker
            dockerfile: apps/api/Dockerfile.worker
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.name }} (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: ${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Image must not contain env files
        run: |
          docker run --rm --entrypoint sh ${{ matrix.name }}:ci -c \
            'found=$(find /repo -path "*/node_modules" -prune -o \( -name ".env" -o -name ".env.*" \) ! -name ".env.example" -print); [ -z "$found" ] || { echo "$found"; exit 1; }'
