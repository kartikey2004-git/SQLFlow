steps:
  - name: gcr.io/cloud-builders/docker
    id: api
    args: ["build", "-f", "apps/api/Dockerfile", "-t", "${_API_IMAGE}", "."]
    env: ["DOCKER_BUILDKIT=1"]
  - name: gcr.io/cloud-builders/docker
    id: worker
    waitFor: ["-"]
    args: ["build", "-f", "apps/api/Dockerfile.worker", "-t", "${_WORKER_IMAGE}", "."]
    env: ["DOCKER_BUILDKIT=1"]
images:
  - "${_API_IMAGE}"
  - "${_WORKER_IMAGE}"
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
